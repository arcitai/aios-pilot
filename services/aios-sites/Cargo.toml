[workspace]
members = ["."]
resolver = "2"

[package]
name = "aios-sites-publisher"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
axum = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
